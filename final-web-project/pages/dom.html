<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מטלת DOM</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #cfefff;
      text-align: center;
      padding: 40px 20px 80px;
      color: #2f4350;
    }

    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #edf7fb;
      color: #34505d;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 42px;
      color: #4e6d7a;
    }

    h2 {
      margin-top: 40px;
      color: #36525f;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
      max-width: 900px;
      margin: 0 auto 30px;
    }

    img {
      width: 90%;
      max-width: 700px;
      margin: 20px auto;
      display: block;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <a href="../index.html" class="home-button">חזרה לבית</a>

  <h1>מטלת DOM</h1>

  <p>
    במטלה זו שיניתי אתר קיים באמצעות DOM דרך ה-Console של הדפדפן.
    שיניתי אלמנטים בדף כדי ליצור גרסה חדשה של האתר.
    התמונה הראשונה מציגה את האתר לפני השינוי, והתמונה השנייה מציגה אותו אחרי השינוי.
  </p>

  <h2>לפני</h2>
  <img src="../before.png" alt="before">

  <h2>אחרי</h2>
  <img src="../after.png" alt="after">

</body>
</html>
