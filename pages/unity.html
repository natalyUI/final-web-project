<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דלת יוניטי</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #121212;
      color: white;
      text-align: center;
    }

    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #edf7fb;
      color: #34505d;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      z-index: 1000;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 60px 20px 100px;
    }

    h1 {
      font-size: 42px;
      color: #c8e5f0;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
      color: #d8e7ee;
      max-width: 760px;
      margin: 0 auto 25px;
    }

    .card {
      margin-top: 30px;
      padding: 35px 20px;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .link-button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 26px;
      background: #edf7fb;
      color: #34505d;
      text-decoration: none;
      border-radius: 14px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <a href="../index.html" class="home-button">חזרה לבית</a>

  <div class="container">
    <h1>דלת יוניטי</h1>

    <div class="card">
      <p>
        כאן נמצאים הסרטונים של עבודות היוניטי שלי:
        תפריט המשחק וסרטון המשחק עצמו.
      </p>

      <a class="link-button" href="https://drive.google.com/drive/folders/1m1PLQLlAU8ExRs_HWbtMGc9E0CazUa4H?usp=sharing" target="_blank">
        לצפייה בקבצי יוניטי
      </a>
    </div>
  </div>

</body>
</html>
