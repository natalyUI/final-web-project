<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כיפה אדומה - עוד על היער</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #101010;
      color: white;
      text-align: center;
    }
    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #edf7fb;
      color: #34505d;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      z-index: 1000;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    img {
      width: 100%;
      max-width: 700px;
      border-radius: 20px;
      margin-bottom: 25px;
    }
    h1 {
      color: #c8e5f0;
      font-size: 38px;
    }
    p {
      font-size: 20px;
      line-height: 1.8;
    }
    a.story-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #dceff7;
      color: #28414d;
      text-decoration: none;
      border-radius: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="home-button">חזרה לבית</a>

  <div class="container">
    <h1>עוד על היער</h1>
    <img src="../assets/story/forest.jpg" alt="יער">

    <p>
      היער לא היה רק מקום אפל. הוא היה מלא רעשים קטנים,
      שבילים מבלבלים ותחושה מוזרה שהעצים עצמם מקשיבים.
      כיפה אדומה ידעה שאם היא תעצור יותר מדי זמן,
      משהו ימצא אותה לפני שהיא תמצא את הדרך.
    </p>

    <a class="story-link" href="forest.html">לחזור למפגש עם הזאב</a>
  </div>
</body>
</html>
